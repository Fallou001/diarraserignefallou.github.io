<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serigne Fallou Diarra, géomaticien</title>
<meta name="description" content="Portfolio de Serigne Fallou Diarra, géomaticien : analyse spatiale, SIG, géomarketing. CV, projets, documents et cartes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#14201F;--mute:#5A6B69;--line:#D9E0DF;--bg:#F4F7F7;--teal:#1F5C5C;--deep:#0B1B1B;--gold:#E8B24A;--soft:#6CC3B7}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font:16px/1.65 "IBM Plex Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Newsreader",Georgia,serif;font-weight:500}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--gold);z-index:60}
nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:1.5rem;padding:.95rem 5vw;background:rgba(11,27,27,.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08)}
.brand{font-family:"Newsreader",Georgia,serif;font-size:1.2rem;color:#fff;text-decoration:none;white-space:nowrap}
.links{display:flex;gap:1.5rem;font-size:.88rem;overflow:auto}
.links a{color:rgba(255,255,255,.68);text-decoration:none;white-space:nowrap;transition:color .2s}
.links a:hover{color:#fff}
.cvl{background:var(--gold);color:var(--deep);font-weight:500;font-size:.85rem;padding:.4rem 1rem;border-radius:50px;text-decoration:none;white-space:nowrap}
.hero{position:relative;min-height:100vh;display:flex;align-items:center;padding:7rem 5vw 5rem;color:#fff;overflow:hidden;background:radial-gradient(120% 90% at 82% 8%,#18494b 0%,var(--deep) 62%)}
#net{position:absolute;inset:0;width:100%;height:100%}
.hero-in{position:relative;max-width:920px;margin:0 auto;width:100%}
.photo{width:116px;height:116px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);box-shadow:0 0 0 8px rgba(232,178,74,.14),0 20px 50px rgba(0,0,0,.35);margin-bottom:1.8rem;animation:fl 5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
h1{font-size:clamp(3rem,9vw,6.8rem);line-height:.98;letter-spacing:-.02em}
.role{font-family:"Newsreader",Georgia,serif;font-style:italic;font-size:clamp(1.3rem,3vw,1.9rem);color:var(--soft);margin-top:1rem}
.tag{color:rgba(255,255,255,.74);max-width:46ch;margin-top:1.2rem;font-size:1.05rem}
.stats{display:flex;flex-wrap:wrap;gap:1.2rem 2.8rem;margin-top:2.4rem}
.stat b{display:block;font:500 2.7rem/1 "Newsreader",Georgia,serif;font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--soft)}
.btns{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:2.4rem}
.btn{display:inline-block;padding:.8rem 1.6rem;background:var(--gold);color:var(--deep);border-radius:50px;font-weight:500;text-decoration:none;transition:transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(232,178,74,.35)}
.btn.ghost{background:none;color:#fff;border:1.5px solid rgba(255,255,255,.3);box-shadow:none}
.btn.ghost:hover{border-color:#fff}
section.s{padding:6rem 5vw}
section.alt{background:#fff}
section.dark{background:var(--deep);color:#fff}
.wrap{max-width:1100px;margin:0 auto}
h2{font-size:clamp(2.1rem,4.6vw,3.1rem);line-height:1.1;margin-bottom:2.6rem}
h2::after{content:"";display:block;width:52px;height:3px;background:var(--gold);margin-top:.8rem;border-radius:2px}
.grid{display:grid;gap:1.25rem;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.card{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:14px;padding:1.6rem;transition:transform .3s,box-shadow .3s,border-color .3s}
.alt .card{background:var(--bg)}
.card::before{content:"";position:absolute;inset:0;opacity:0;transition:opacity .3s;background:radial-gradient(320px circle at var(--x,50%) var(--y,50%),rgba(31,92,92,.13),transparent 62%)}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(11,27,27,.1);border-color:#b3cac7}
.card:hover::before{opacity:1}
.card>*{position:relative}
.card h3{font-size:1.32rem;line-height:1.25}
.num{font:italic 400 2.2rem/1 "Newsreader",Georgia,serif;color:var(--gold);margin-bottom:.6rem}
.when{color:var(--teal);font-size:.85rem;font-weight:500}
.sub{color:var(--mute);font-size:.93rem}
.card p,.tl-i p{margin-top:.55rem;color:#38494A}
.pills{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.9rem}
.pills i{font-style:normal;font-size:.78rem;padding:.14rem .7rem;border-radius:50px;background:rgba(31,92,92,.09);color:var(--teal)}
.lnk{display:inline-block;margin-top:1rem;padding:.45rem 1.1rem;border-radius:50px;background:var(--teal);color:#fff;font-size:.88rem;text-decoration:none;transition:background .2s}
.lnk:hover{background:var(--deep)}
.soon{display:inline-block;margin-top:1rem;font-size:.85rem;color:var(--mute);border:1px solid var(--line);border-radius:50px;padding:.1rem .8rem}
.tl{position:relative;margin-left:.5rem;padding-left:2rem;border-left:2px solid var(--line)}
.tl-i{position:relative;padding-bottom:2.4rem;max-width:68ch}
.tl-i::before{content:"";position:absolute;left:-2.6rem;top:.4rem;width:14px;height:14px;border-radius:50%;background:var(--teal);border:3px solid #fff;box-shadow:0 0 0 2px var(--teal)}
.tl-i h3{font-size:1.4rem;line-height:1.25;margin-top:.1rem}
.thumb{display:block;width:100%;border-radius:8px;margin-bottom:1rem;cursor:zoom-in;border:1px solid var(--line);transition:transform .4s}
.card:hover .thumb{transform:scale(1.02)}
.pv{display:block;border:1px solid var(--line);border-radius:8px;margin-bottom:1rem;overflow:hidden;background:#fff}
.pv canvas{display:block;width:100%;height:auto;min-height:120px;max-height:340px;object-fit:cover;object-position:top;transition:transform .4s}
.pv img{display:block;width:100%;height:auto;min-height:120px;max-height:340px;object-fit:cover;object-position:top;transition:transform .4s}
.card:hover .pv canvas,.card:hover .pv img{transform:scale(1.02)}
.nopdf{display:flex;align-items:center;justify-content:center;min-height:120px;color:var(--mute);font-size:.85rem}
.dark h2{color:#fff}
.big{display:inline-block;font:500 clamp(1.5rem,4vw,2.6rem)/1.2 "Newsreader",Georgia,serif;color:#fff;text-decoration:none;border-bottom:2px solid var(--gold);margin-bottom:2rem;word-break:break-all}
.row{display:flex;flex-wrap:wrap;gap:.8rem}
.lb{position:fixed;inset:0;z-index:80;background:rgba(4,9,9,.95);display:none;align-items:center;justify-content:center;padding:1.5rem;cursor:zoom-out}
.lb.on{display:flex}.lb img{max-width:94vw;max-height:92vh;border-radius:8px;object-fit:contain}
footer{background:#071212;color:rgba(255,255,255,.5);text-align:center;padding:1.6rem;font-size:.85rem}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}
@media (max-width:760px){.links{display:none}section.s{padding:4.5rem 6vw}.hero{padding-top:6rem}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.photo{animation:none}.rv{opacity:1;transform:none;transition:none}}
</style>
</head>
<body>
<div id="bar"></div>
<nav><a class="brand" id="brand" href="#top"></a><div class="links" id="nav"></div><a class="cvl" id="cv" href="#">CV</a></nav>
<header class="hero" id="top">
  <canvas id="net" aria-hidden="true"></canvas>
  <div class="hero-in">
    <img class="photo" id="photo" alt="" hidden>
    <h1 id="name"></h1>
    <p class="role" id="role"></p>
    <p class="tag" id="tagline"></p>
    <div class="stats" id="stats"></div>
    <div class="btns"><a class="btn" href="#projets">Voir mes projets</a><a class="btn ghost" id="cv2" href="#">Télécharger le CV</a></div>
  </div>
</header>
<main id="main"></main>
<footer id="foot"></footer>
<div class="lb" id="lb" role="dialog" aria-label="Aperçu"><img alt=""></div>

<script>
/* ======================================================================
   CONTENU DU SITE — c’est la seule partie à modifier pour le mettre à jour.
   - Ajouter un projet, une carte ou un document : copier un bloc { ... } dans la liste.
   - Une liste vide ([]) masque la section et son lien de menu.
   - Un document sans "url" affiche son "status" (ex. « À venir »).
   - CV : déposer le PDF dans le dépôt, à côté de ce fichier, sous le nom cv.pdf
   - Photo (facultative) : photo.jpg à côté de ce fichier.
   - Carte : champ "pdf" (ex. ma-carte.pdf, l’aperçu de la page 1 est généré tout seul) ou "img" (image cliquable en plein écran).
   - Aperçu instantané : un fichier .jpg du même nom que le PDF (ex. atlas-ev-q12.jpg), créé avec apercus.py.
   - Dépose les fichiers dans le dépôt, à côté de ce fichier, avec des noms sans espaces ni accents (ou dans un dossier : pdf: "cartes/nom.pdf").
   ====================================================================== */
const C = {
  profile: {
    name: "Serigne Fallou Diarra",
    title: "Géomaticien",
    tagline: "Analyse spatiale, SIG et géomarketing : la donnée géographique au service de l’aide à la décision territoriale.",
    location: "Créteil, France",
    email: "diarraserignefallou@gmail.com",
    linkedin: "https://www.linkedin.com/in/serigne-fallou-diarra-b6464825a/",
    github: "https://github.com/Fallou001",
    cv: "cv.pdf",
    photo: "photo.jpg",
    since: "2023-05-01"
  },
  experience: [
    { when: "2025 à 2027", role: "Chargé de projet géomatique (apprentissage)", org: "DRIEAT, Créteil",
      text: "Bilan des agréments 2025 : amélioration du script R et rédaction du rapport. Géotraitements sous QGIS, production et mise à jour de couches de données." },
    { when: "2024 à 2025", role: "Technicien SIG (apprentissage)", org: "Toulouse Métropole",
      text: "Intégrations et analyses spatiales sous QGIS et FME. Applications de webmapping avec OpenLayers et Leaflet." },
    { when: "2023 à 2024", role: "Technicien en géomatique (apprentissage)", org: "BRGM, Aubière",
      text: "Intégration et qualification de données géoscientifiques. Administration de bases PostgreSQL/PostGIS." },
    { when: "2023", role: "Technicien SIG (stage)", org: "Terreal France, Roumazières-Loubert",
      text: "Production de cartes thématiques sous QGIS." }
  ],
  projects: [
    { title: "Analyse immobilière DVF",
      text: "Tableau de bord interactif pour explorer et visualiser les données de valeurs foncières.",
      stack: ["R", "Shiny"], url: "https://serignefalloudiarra.shinyapps.io/dvf_dashbord_final/" },
    { title: "Parcs, jardins et POI de Clermont-Ferrand",
      text: "Carte interactive des parcs, jardins, îlots de fraîcheur et points d’intérêt de la ville. Projet de la licence professionnelle GGAT.",
      stack: ["Leaflet", "PHP", "PostgreSQL/PostGIS", "GeoJSON"], url: "https://falloudiarra.alwaysdata.net/leaflet/index.html" },
    { title: "CovoitApp",
      text: "Application web complète de covoiturage avec géolocalisation PostGIS.",
      stack: ["Next.js", "TypeScript", "PostgreSQL/PostGIS"], url: "https://japandi.onrender.com" }
  ],
  documents: [
    { title: "Bilan des agréments 2025", type: "Rapport, DRIEAT", year: "2025", url: "", status: "À venir" }
    // { title: "Titre du document", type: "Mémoire", year: "2027", url: "mon-document.pdf" },
  ],
  maps: [
    { title: "Atlas Limeil, 6 zones (A3)", pdf: "atlas-limeil-6-zones-a3.pdf" },
    { title: "Atlas EV Q12", pdf: "atlas-ev-q12.pdf" },
    { title: "ECO6 : la répartition des emplois par catégorie", pdf: "eco6-repartition-emplois.pdf" },
    { title: "Nombre de T2 par adresse et par bailleur", pdf: "nombre-t2-par-bailleur.pdf" },
    { title: "Aménagements, transports et environnement", pdf: "amenagements-transports-environnement.pdf" },
    { title: "Carte de synthèse", img: "carte-de-synthese.png.png" },
    { title: "DP", pdf: "dp-final.pdf" }
    // modèle : { title: "Titre", text: "Une phrase.", stack: ["QGIS"], pdf: "nom.pdf" },
  ],
  skills: [
    { group: "SIG et cartographie", items: ["QGIS", "ArcGIS Pro", "Arcpy", "ArcGIS Experience Builder", "ArcGIS Online", "Geoconcept", "Illustrator", "Inkscape", "Philcarto", "GeoDa"] },
    { group: "Analyse spatiale", items: ["Zones de chalandise", "Scoring territorial", "Isochrones", "Géo-segmentation", "Potentiel de marché"] },
    { group: "Webmapping", items: ["OpenLayers", "Leaflet", "Next.js", "TypeScript", "PHP"] },
    { group: "Programmation et données", items: ["Python", "R", "JavaScript", "HTML", "CSS", "PostgreSQL", "PostGIS", "FME"] },
    { group: "Topographie", items: ["AutoCAD", "Covadis", "TopoGen"] }
  ],
  education: [
    { when: "2025 à 2027", title: "Master Data, géomarketing", place: "Université Paris-Est Créteil (UPEC)" },
    { when: "2024 à 2025", title: "Licence professionnelle génie géomatique pour l’aménagement du territoire", place: "IUT, Université de Toulouse, Auch" },
    { when: "2023 à 2024", title: "Titre Technicien en Géomatique", place: "IDGEO, Colomiers" },
    { when: "2019 à 2021", title: "Technicien Spécialisé Topographie", place: "ITSGRT, Meknès" }
  ],
  certs: [
    { title: "Gérez du code avec Git et GitHub", org: "OpenClassrooms" },
    { title: "Initiez-vous à R pour l’analyse de données", org: "OpenClassrooms" },
    { title: "HTML, CSS, and JavaScript for Web Developers", org: "Johns Hopkins University" },
    { title: "Mastering Geospatial Analysis with QGIS", org: "L&T EduTech" },
    { title: "Database Design and Basic SQL in PostgreSQL", org: "University of Michigan" },
    { title: "Databases and SQL for Data Science with Python", org: "Coursera" }
  ]
};

/* ============================ RENDU (ne pas modifier) ============================ */
const h = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const k in attrs || {}) k === "text" ? e.textContent = attrs[k] : e.setAttribute(k, attrs[k]);
  kids.flat().forEach(c => c != null && e.append(c));
  return e;
};
const $ = id => document.getElementById(id);
const P = C.profile, still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const pills = a => a && a.length ? h("div", { class: "pills" }, a.map(t => h("i", { text: t }))) : null;
const btn = (href, text) => h("a", { class: "lnk", href, text, target: "_blank", rel: "noopener" });
const card = (...k) => h("div", { class: "card rv" }, ...k);
const p = t => h("p", { text: t });
const sub = t => h("div", { class: "sub", text: t });

$("name").textContent = P.name; $("brand").textContent = P.name;
$("role").textContent = P.title; $("tagline").textContent = P.tagline;
$("cv").href = P.cv; $("cv2").href = P.cv;
$("foot").textContent = "© " + new Date().getFullYear() + " " + P.name + ", " + P.location;
if (P.photo) { const ph = $("photo"); ph.alt = P.name; ph.onload = () => ph.hidden = false; ph.src = P.photo; }

const pvImg = r => {
  const i = h("img", { src: r.pdf.replace(/\.pdf$/i, ".jpg"), alt: "", loading: "lazy", decoding: "async" });
  i.onerror = () => { const c = h("canvas", { "data-pdf": r.pdf }); i.replaceWith(c); watchPdf(c); };
  return i;
};
const defs = [
  ["parcours", "Parcours", C.experience, "tl", r => h("div", { class: "tl-i rv" }, h("div", { class: "when", text: r.when }), h("h3", { text: r.role }), sub(r.org), p(r.text))],
  ["projets", "Projets", C.projects, "grid", (r, i) => card(h("div", { class: "num", text: "0" + (i + 1) }), h("h3", { text: r.title }), p(r.text), pills(r.stack), r.url ? btn(r.url, "Voir en ligne") : null)],
  ["competences", "Compétences", C.skills, "grid", r => card(h("h3", { text: r.group }), pills(r.items))],
  ["cartes", "Cartes", C.maps, "grid", r => card(
    r.img ? h("img", { class: "thumb", src: r.img, alt: r.title, loading: "lazy" })
      : r.pdf ? h("a", { class: "pv", href: r.pdf, target: "_blank", rel: "noopener", "aria-label": r.title }, pvImg(r)) : null,
    h("h3", { text: r.title }), r.text ? p(r.text) : null, pills(r.stack),
    r.pdf ? btn(r.pdf, "Ouvrir le PDF") : r.url ? btn(r.url, "Ouvrir") : null)],
  ["documents", "Documents", C.documents, "grid", r => card(h("div", { class: "when", text: r.year }), h("h3", { text: r.title }), sub(r.type), r.url ? btn(r.url, "Consulter") : h("span", { class: "soon", text: r.status || "À venir" }))],
  ["formation", "Formation", C.education, "grid", r => card(h("div", { class: "when", text: r.when }), h("h3", { text: r.title }), sub(r.place))],
  ["certifications", "Certifications", C.certs, "grid", r => card(h("h3", { text: r.title }), sub(r.org))]
];
const main = $("main"), nav = $("nav");
let k = 0;
defs.forEach(([id, label, list, kind, fn]) => {
  if (!list || !list.length) return;
  main.append(h("section", { id, class: "s" + (k++ % 2 ? "" : " alt") }, h("div", { class: "wrap" }, h("h2", { text: label, class: "rv" }), h("div", { class: kind }, list.map(fn)))));
  nav.append(h("a", { href: "#" + id, text: label }));
});
main.append(h("section", { id: "contact", class: "s dark" }, h("div", { class: "wrap" }, h("h2", { text: "Contact", class: "rv" }),
  h("div", { class: "rv" }, h("a", { class: "big", href: "mailto:" + P.email, text: P.email })),
  h("div", { class: "row rv" }, h("a", { class: "btn", href: P.linkedin, target: "_blank", rel: "noopener", text: "LinkedIn" }),
    h("a", { class: "btn ghost", href: P.github, target: "_blank", rel: "noopener", text: "GitHub" }), h("a", { class: "btn ghost", href: P.cv, text: "CV" })))));
nav.append(h("a", { href: "#contact", text: "Contact" }));

/* Chiffres calculés depuis les données */
[[Math.floor((Date.now() - new Date(P.since)) / 31557600000), "ans de géomatique"], [C.experience.length, "expériences"],
 [C.projects.filter(x => x.url).length, "projets en ligne"], [C.certs.length, "certifications"]]
  .filter(s => s[0] > 0).forEach(([n, label]) => {
    const b = h("b", { text: still ? n : "0" });
    $("stats").append(h("div", { class: "stat" }, b, h("span", { text: label })));
    if (!still) { const t0 = performance.now(); const tick = t => { const q = Math.min((t - t0) / 1400, 1); b.textContent = Math.round(n * (1 - Math.pow(1 - q, 3))); if (q < 1) requestAnimationFrame(tick); }; requestAnimationFrame(tick); }
  });

/* Apparition au défilement, barre de progression, halo des cartes, aperçu plein écran */
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .12 });
document.querySelectorAll(".rv").forEach(el => io.observe(el));
addEventListener("scroll", () => { $("bar").style.width = scrollY / Math.max(1, document.documentElement.scrollHeight - innerHeight) * 100 + "%"; }, { passive: true });
document.addEventListener("pointermove", e => {
  const c = e.target.closest(".card");
  if (c) { const r = c.getBoundingClientRect(); c.style.setProperty("--x", e.clientX - r.left + "px"); c.style.setProperty("--y", e.clientY - r.top + "px"); }
});
const lb = $("lb");
document.addEventListener("click", e => {
  const t = e.target.closest(".thumb");
  if (t) { lb.querySelector("img").src = t.src; lb.classList.add("on"); } else lb.classList.remove("on");
});
document.addEventListener("keydown", e => { if (e.key === "Escape") lb.classList.remove("on"); });

/* Secours : si l’image d’aperçu (même nom que le PDF, en .jpg) n’existe pas, la page 1 est dessinée avec pdf.js, une carte à la fois */
const CDN = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
let ready, queue = Promise.resolve(), pio;
const load = () => ready || (ready = new Promise((ok, ko) => {
  const sc = h("script", { src: CDN + "pdf.min.js" });
  sc.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = CDN + "pdf.worker.min.js"; ok(); };
  sc.onerror = ko; document.head.append(sc);
}));
const render = c => load().then(() => pdfjsLib.getDocument({ url: c.dataset.pdf, disableAutoFetch: true }).promise)
  .then(d => d.getPage(1)).then(pg => {
    const v = pg.getViewport({ scale: 560 / pg.getViewport({ scale: 1 }).width });
    c.width = v.width; c.height = v.height;
    return pg.render({ canvasContext: c.getContext("2d"), viewport: v }).promise;
  }).catch(err => {
    console.error("Aperçu PDF impossible :", c.dataset.pdf, err);
    c.replaceWith(h("iframe", { src: c.dataset.pdf + "#page=1&view=FitH&toolbar=0&navpanes=0", title: c.dataset.pdf, loading: "lazy", scrolling: "no", style: "width:100%;height:320px;border:0;pointer-events:none;display:block" }));
  });
const watchPdf = c => {
  pio = pio || new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    pio.unobserve(e.target); queue = queue.then(() => render(e.target));
  }), { rootMargin: "200px" });
  pio.observe(c);
};

/* Réseau de points spatiaux animé dans l’en-tête, qui réagit à la souris */
const cv = $("net"), cx = cv.getContext("2d"), hero = $("top");
let W, H, pts = [], mx = -999, my = -999, vis = true;
const size = () => {
  const d = Math.min(devicePixelRatio || 1, 2);
  W = cv.offsetWidth; H = cv.offsetHeight; cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0);
  pts = Array.from({ length: Math.round(W * H / 15000) }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .4, vy: (Math.random() - .5) * .4 }));
};
const draw = () => {
  cx.clearRect(0, 0, W, H);
  pts.forEach((a, i) => {
    a.x += a.vx; a.y += a.vy;
    if (a.x < 0 || a.x > W) a.vx *= -1;
    if (a.y < 0 || a.y > H) a.vy *= -1;
    cx.fillStyle = "rgba(108,195,183,.85)"; cx.beginPath(); cx.arc(a.x, a.y, 1.7, 0, 6.3); cx.fill();
    for (let j = i + 1; j < pts.length; j++) {
      const b = pts[j], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < 130) { cx.strokeStyle = "rgba(108,195,183," + .3 * (1 - d / 130) + ")"; cx.beginPath(); cx.moveTo(a.x, a.y); cx.lineTo(b.x, b.y); cx.stroke(); }
    }
    const m = Math.hypot(a.x - mx, a.y - my);
    if (m < 190) { cx.strokeStyle = "rgba(232,178,74," + .75 * (1 - m / 190) + ")"; cx.beginPath(); cx.moveTo(a.x, a.y); cx.lineTo(mx, my); cx.stroke(); }
  });
};
size(); addEventListener("resize", size);
hero.addEventListener("pointermove", e => { const r = cv.getBoundingClientRect(); mx = e.clientX - r.left; my = e.clientY - r.top; });
hero.addEventListener("pointerleave", () => mx = my = -999);
new IntersectionObserver(e => vis = e[0].isIntersecting).observe(hero);
if (still) draw(); else (function loop() { if (vis && !document.hidden) draw(); requestAnimationFrame(loop); })();
</script>
